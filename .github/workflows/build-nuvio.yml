name: Build Nuvio

on:
  workflow_dispatch:
  push:
    branches:
      - debugging

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    name: Detect Changed Targets
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.detect.outputs.common }}
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}

    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --progress origin "${GITHUB_REF}"
          git checkout --force "${GITHUB_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Detect changed targets in this push
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          common=false
          android=false
          ios=false

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            common=true
            android=true
            ios=true
          elif [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            common=true
            android=true
            ios=true
          else
            git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}" > changed-files.txt

            echo "Changed files:"
            cat changed-files.txt

            while IFS= read -r file; do
              case "$file" in
                composeApp/src/commonMain/*|\
                composeApp/src/fullCommonMain/*|\
                composeApp/build.gradle.kts|\
                gradle/*|\
                gradle.properties|\
                settings.gradle.kts|\
                build.gradle.kts|\
                gradlew|\
                gradlew.bat|\
                .github/workflows/*)
                  common=true
                  ;;
              esac

              case "$file" in
                androidApp/*|\
                composeApp/src/androidMain/*|\
                composeApp/src/androidFull/*|\
                composeApp/src/androidPlaystore/*|\
                composeApp/libs/*|\
                composeApp/proguard-rules.pro)
                  android=true
                  ;;
              esac

              case "$file" in
                iosApp/*|\
                MPVKit/*|\
                composeApp/src/iosMain/*|\
                composeApp/src/iosFull/*|\
                composeApp/src/iosAppStore/*|\
                composeApp/nativeInterop/*)
                  ios=true
                  ;;
              esac
            done < changed-files.txt
          fi

          echo "common=${common}" >> "$GITHUB_OUTPUT"
          echo "android=${android}" >> "$GITHUB_OUTPUT"
          echo "ios=${ios}" >> "$GITHUB_OUTPUT"

          echo "Detected targets:"
          echo "common=${common}"
          echo "android=${android}"
          echo "ios=${ios}"

  build-ios-enhanced:
    name: Build iOS Enhanced Version
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ios == 'true' || needs.detect-changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --progress origin "${GITHUB_REF}"
          git checkout --force "${GITHUB_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Fetch iOS Specific Submodule
        run: |
          set -euo pipefail

          git submodule sync -- MPVKit
          git submodule update --init --depth 1 -- MPVKit

      - name: Pull Git LFS files
        run: |
          set -euo pipefail

          git lfs install --local
          git lfs pull

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}
          PREMIUMIZE_CLIENT_SECRET=${{ secrets.PREMIUMIZE_CLIENT_SECRET }}
          PREMIUMIZE_REDIRECT_URI=${{ secrets.PREMIUMIZE_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF

      - name: Build iOS App via Xcode
        run: |
          set -euo pipefail

          cd iosApp

          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package App into .ipa
        run: |
          set -euo pipefail

          cd iosApp/build/Build/Products/Release-iphoneos

          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Nuvio.app/Info.plist)

          rm -rf Payload
          mkdir -p Payload
          mv Nuvio.app Payload/

          zip -q -r "Nuvio-v${APP_VERSION}-Enhanced.ipa" Payload

          echo "IPA_FILENAME=Nuvio-v${APP_VERSION}-Enhanced.ipa" >> "$GITHUB_ENV"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Nuvio-iOS-Enhanced
          path: iosApp/build/Build/Products/Release-iphoneos/${{ env.IPA_FILENAME }}

  build-android-enhanced:
    name: Build Android Enhanced Version
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.android == 'true' || needs.detect-changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --progress origin "${GITHUB_REF}"
          git checkout --force "${GITHUB_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}
          PREMIUMIZE_CLIENT_SECRET=${{ secrets.PREMIUMIZE_CLIENT_SECRET }}
          PREMIUMIZE_REDIRECT_URI=${{ secrets.PREMIUMIZE_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_ANDROID_DISTRIBUTION=full
          EOF

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Enhanced APK
        run: |
          set -euo pipefail

          ./gradlew \
            :androidApp:assembleFullDebug \
            -Pnuvio.splitAbi=true \
            --stacktrace

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Nuvio-Android-Enhanced
          path: androidApp/build/outputs/apk/full/debug/*.apk
